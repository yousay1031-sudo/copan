<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理画面 - コパン</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #FFF8F0 0%, #FFFFFF 100%);
            min-height: 100vh;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(255, 159, 90, 0.25);
            max-width: 400px;
            width: 100%;
        }

        .login-box h1 {
            color: #FF9F5A;
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #8B5A3C;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #FF9F5A;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FF9F5A 0%, #FFB47A 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(255, 159, 90, 0.4);
        }

        .error-message {
            color: #FF6B6B;
            font-size: 0.9rem;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        /* 管理画面スタイル */
        .admin-container {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 2px 12px rgba(255, 159, 90, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            color: #FF9F5A;
            font-size: 1.8rem;
        }

        .logout-btn {
            padding: 10px 20px;
            background: #E0E0E0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #CCCCCC;
        }

        .news-actions {
            margin-bottom: 20px;
        }

        .add-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #7FD8BE 0%, #98E5CF 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(127, 216, 190, 0.4);
        }

        .news-list {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 2px 12px rgba(255, 159, 90, 0.15);
        }

        .news-item {
            padding: 20px;
            border-bottom: 1px solid #F0F0F0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-content {
            flex: 1;
        }

        .news-date {
            color: #A67C5D;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .news-title {
            color: #8B5A3C;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .news-text {
            color: #8B5A3C;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .news-label {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .label-info {
            background: #A8D8F0;
            color: #2B5C75;
        }

        .label-event {
            background: #FFB4C8;
            color: #8B2346;
        }

        .label-draft {
            background: #E0E0E0;
            color: #666666;
        }

        .news-actions-btns {
            display: flex;
            gap: 10px;
        }

        .edit-btn, .delete-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .edit-btn {
            background: #FFB47A;
            color: white;
        }

        .edit-btn:hover {
            background: #FF9F5A;
        }

        .delete-btn {
            background: #FFB4C8;
            color: white;
        }

        .delete-btn:hover {
            background: #FF9AAE;
        }

        /* モーダルスタイル */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #FF9F5A;
            font-size: 1.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #8B5A3C;
        }

        .modal-form .form-group {
            margin-bottom: 20px;
        }

        .modal-form label {
            display: block;
            color: #8B5A3C;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .modal-form input,
        .modal-form textarea,
        .modal-form select {
            width: 100%;
            padding: 12px;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 1rem;
        }

        .modal-form textarea {
            min-height: 150px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .cancel-btn {
            padding: 12px 24px;
            background: #E0E0E0;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .save-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #FF9F5A 0%, #FFB47A 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #A67C5D;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #FFB47A;
        }
    </style>
</head>
<body>
    <!-- ログイン画面 -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h1><i class="fas fa-lock"></i> 管理画面ログイン</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="password">パスワード</label>
                    <input type="password" id="password" placeholder="パスワードを入力" required>
                </div>
                <button type="submit" class="btn">
                    <i class="fas fa-sign-in-alt"></i> ログイン
                </button>
                <div class="error-message" id="errorMessage">
                    パスワードが正しくありません
                </div>
            </form>
        </div>
    </div>

    <!-- 管理画面 -->
    <div class="admin-container" id="adminContainer">
        <div class="admin-header">
            <h1><i class="fas fa-newspaper"></i> お知らせ管理</h1>
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> ログアウト
            </button>
        </div>

        <div class="news-actions">
            <button class="add-btn" onclick="openModal()">
                <i class="fas fa-plus"></i> 新規お知らせを追加
            </button>
        </div>

        <div class="news-list" id="newsList">
            <!-- 動的に読み込まれる -->
        </div>
    </div>

    <!-- モーダル -->
    <div class="modal" id="newsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">お知らせを追加</h2>
                <button class="close-btn" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form class="modal-form" id="newsForm">
                <input type="hidden" id="editId">
                
                <div class="form-group">
                    <label for="newsDate">日付 <span style="color: #FF6B6B;">*</span></label>
                    <input type="date" id="newsDate" required>
                </div>

                <div class="form-group">
                    <label for="newsCategory">カテゴリ <span style="color: #FF6B6B;">*</span></label>
                    <select id="newsCategory" required>
                        <option value="お知らせ">お知らせ</option>
                        <option value="イベント">イベント</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="newsTitle">タイトル <span style="color: #FF6B6B;">*</span></label>
                    <input type="text" id="newsTitle" placeholder="タイトルを入力" required>
                </div>

                <div class="form-group">
                    <label for="newsStatus">状態</label>
                    <select id="newsStatus">
                        <option value="published">公開</option>
                        <option value="draft">下書き</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="cancel-btn" onclick="closeModal()">
                        キャンセル
                    </button>
                    <button type="submit" class="save-btn">
                        <i class="fas fa-save"></i> 保存
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
/**
 * コパン管理画面 JavaScript
 * お知らせ管理システム
 */

// 管理者パスワード（本番環境では環境変数などに変更してください）
const ADMIN_PASSWORD = 'copan2025';

// LocalStorageキー
const STORAGE_KEY = 'copan_news';
const AUTH_KEY = 'copan_auth';

/**
 * ページ読み込み時の初期化
 */
document.addEventListener('DOMContentLoaded', function() {
    checkAuth();
    setupLoginForm();
    setupNewsForm();
    
    // 今日の日付をデフォルトに設定
    document.getElementById('newsDate').valueAsDate = new Date();
});

/**
 * 認証チェック
 */
function checkAuth() {
    const isAuthenticated = sessionStorage.getItem(AUTH_KEY);
    
    if (isAuthenticated === 'true') {
        showAdminPanel();
    } else {
        showLoginPanel();
    }
}

/**
 * ログインパネルを表示
 */
function showLoginPanel() {
    document.getElementById('loginContainer').style.display = 'flex';
    document.getElementById('adminContainer').style.display = 'none';
}

/**
 * 管理パネルを表示
 */
function showAdminPanel() {
    document.getElementById('loginContainer').style.display = 'none';
    document.getElementById('adminContainer').style.display = 'block';
    loadNewsList();
}

/**
 * ログインフォームのセットアップ
 */
function setupLoginForm() {
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const password = document.getElementById('password').value;
        const errorMessage = document.getElementById('errorMessage');
        
        if (password === ADMIN_PASSWORD) {
            sessionStorage.setItem(AUTH_KEY, 'true');
            errorMessage.style.display = 'none';
            showAdminPanel();
        } else {
            errorMessage.style.display = 'block';
            document.getElementById('password').value = '';
        }
    });
}

/**
 * ログアウト
 */
function logout() {
    if (confirm('ログアウトしますか？')) {
        sessionStorage.removeItem(AUTH_KEY);
        showLoginPanel();
        document.getElementById('password').value = '';
    }
}

/**
 * お知らせデータを取得
 */
function getNewsData() {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : [];
}

/**
 * お知らせデータを保存
 */
function saveNewsData(newsArray) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(newsArray));
    // フロントページとデータを同期
    syncWithFrontPage(newsArray);
}

/**
 * フロントページとデータを同期
 */
function syncWithFrontPage(newsArray) {
    // 公開中のお知らせのみをフィルタ
    const publishedNews = newsArray
        .filter(item => item.status === 'published')
        .sort((a, b) => new Date(b.date) - new Date(a.date))
        .slice(0, 3); // 最新3件
    
    localStorage.setItem('copan_public_news', JSON.stringify(publishedNews));
}

/**
 * お知らせ一覧を読み込み
 */
function loadNewsList() {
    const newsList = getNewsData();
    const container = document.getElementById('newsList');
    
    if (newsList.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <h3>お知らせがありません</h3>
                <p>「新規お知らせを追加」ボタンから追加してください</p>
            </div>
        `;
        return;
    }
    
    // 日付順にソート（新しい順）
    newsList.sort((a, b) => new Date(b.date) - new Date(a.date));
    
    container.innerHTML = newsList.map((item, index) => {
        const date = new Date(item.date);
        const formattedDate = `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
        
        let labelClass = 'label-info';
        if (item.category === 'イベント') {
            labelClass = 'label-event';
        } else if (item.status === 'draft') {
            labelClass = 'label-draft';
        }
        
        const statusText = item.status === 'draft' ? ' (下書き)' : '';
        
        return `
            <div class="news-item">
                <div class="news-content">
                    <div class="news-date">${formattedDate}</div>
                    <span class="news-label ${labelClass}">${item.category}${statusText}</span>
                    <div class="news-title">${item.title}</div>
                </div>
                <div class="news-actions-btns">
                    <button class="edit-btn" onclick="editNews(${index})">
                        <i class="fas fa-edit"></i> 編集
                    </button>
                    <button class="delete-btn" onclick="deleteNews(${index})">
                        <i class="fas fa-trash"></i> 削除
                    </button>
                </div>
            </div>
        `;
    }).join('');
}

/**
 * モーダルを開く
 */
function openModal(editIndex = null) {
    const modal = document.getElementById('newsModal');
    const modalTitle = document.getElementById('modalTitle');
    const form = document.getElementById('newsForm');
    
    form.reset();
    document.getElementById('newsDate').valueAsDate = new Date();
    document.getElementById('editId').value = '';
    
    if (editIndex !== null) {
        // 編集モード
        const newsList = getNewsData();
        const item = newsList[editIndex];
        
        modalTitle.textContent = 'お知らせを編集';
        document.getElementById('editId').value = editIndex;
        document.getElementById('newsDate').value = item.date;
        document.getElementById('newsCategory').value = item.category;
        document.getElementById('newsTitle').value = item.title;
        document.getElementById('newsStatus').value = item.status;
    } else {
        // 新規作成モード
        modalTitle.textContent = 'お知らせを追加';
    }
    
    modal.style.display = 'flex';
}

/**
 * モーダルを閉じる
 */
function closeModal() {
    document.getElementById('newsModal').style.display = 'none';
}

/**
 * お知らせフォームのセットアップ
 */
function setupNewsForm() {
    document.getElementById('newsForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const editId = document.getElementById('editId').value;
        const newsData = {
            date: document.getElementById('newsDate').value,
            category: document.getElementById('newsCategory').value,
            title: document.getElementById('newsTitle').value,
            status: document.getElementById('newsStatus').value
        };
        
        let newsList = getNewsData();
        
        if (editId !== '') {
            // 編集
            newsList[parseInt(editId)] = newsData;
        } else {
            // 新規追加
            newsList.push(newsData);
        }
        
        saveNewsData(newsList);
        closeModal();
        loadNewsList();
        
        alert(editId !== '' ? 'お知らせを更新しました' : 'お知らせを追加しました');
    });
}

/**
 * お知らせを編集
 */
function editNews(index) {
    openModal(index);
}

/**
 * お知らせを削除
 */
function deleteNews(index) {
    if (!confirm('このお知らせを削除しますか？')) {
        return;
    }
    
    let newsList = getNewsData();
    newsList.splice(index, 1);
    saveNewsData(newsList);
    loadNewsList();
    
    alert('お知らせを削除しました');
}

/**
 * モーダル外クリックで閉じる
 */
document.getElementById('newsModal').addEventListener('click', function(e) {
    if (e.target === this) {
        closeModal();
    }
});
    </script>
</body>
</html>
